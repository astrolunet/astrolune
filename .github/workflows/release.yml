name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            cc: gcc
            cxx: g++
          - os: windows-latest
            platform: windows-x64
            cc: cl
            cxx: cl
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Validate release tag
        shell: pwsh
        run: |
          $expected = "v$((Get-Content VERSION).Trim())"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Tag $env:RELEASE_TAG does not match VERSION ($expected)"
          }

      - name: Install libsodium (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Install libsodium (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libsodium:x64-windows-static

      - name: Configure distribution (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake --preset dist
          -DASTROLUNE_CRYPTO_BACKEND=sodium
          -DSodium_LIBRARY=/usr/lib/x86_64-linux-gnu/libsodium.a

      - name: Configure distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake --preset dist
          -DASTROLUNE_CRYPTO_BACKEND=sodium
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build distribution
        run: cmake --build --preset dist

      - name: Verify node version
        shell: pwsh
        run: |
          $suffix = if ($env:RUNNER_OS -eq "Windows") { ".exe" } else { "" }
          $reported = & "build/dist/bin/alnode$suffix" --version
          if ($reported -ne "alnode $((Get-Content VERSION).Trim())") {
            throw "Unexpected version: $reported"
          }

      - name: Create release archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $suffix = if ($env:RUNNER_OS -eq "Windows") { ".exe" } else { "" }
          $archive = "astrolune-v$version-${{ matrix.platform }}.zip"
          New-Item -ItemType Directory -Path package/bin | Out-Null
          Copy-Item "build/dist/bin/alnode$suffix" package/bin/
          Copy-Item "build/dist/bin/trocto$suffix" package/bin/
          Copy-Item README.md, LICENSE, SECURITY.md, VERSION package/
          Copy-Item examples package/examples -Recurse
          Compress-Archive -Path package/* -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: astrolune-${{ matrix.platform }}
          path: |
            astrolune-*.zip
            astrolune-*.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: astrolune-*
          path: release
          merge-multiple: true

      - name: Create release draft
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --draft
          fi

      - name: Upload release assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release/astrolune-*.zip release/astrolune-*.sha256)
          if (( ${#assets[@]} != 4 )); then
            printf 'Expected 4 release assets, found %d\n' "${#assets[@]}" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber; then
                break
              fi

              if (( attempt == 3 )); then
                printf 'Failed to upload %s after %d attempts\n' "$asset" "$attempt" >&2
                exit 1
              fi

              sleep $((attempt * 10))
            done
          done

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
