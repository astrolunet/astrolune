name: Feature request
description: Propose an improvement or research direction
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation or user need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the behavior or design, including alternatives considered.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: Explain consensus, storage, ABI, wire-format or operational implications.
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement or test this proposal.
