name: Bug report
description: Report a reproducible defect in Astrolune
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use the private security advisory flow instead.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest command sequence or test case that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, compiler, CMake version and crypto backend.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or sanitizer output
      render: text
